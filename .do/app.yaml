name: quick-weather-view-api
services:
- name: api
  source_dir: /backend
  github:
    repo: RuiyuHuang50/Quick-Weather-View
    branch: feature-new-code
  run_command: npm start
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  envs:
  - key: NODE_ENV
    value: production
  - key: OPENWEATHER_API_KEY
    value: "YOUR_API_KEY_HERE"
    type: SECRET
  health_check:
    http_path: /health
  http_port: 3000
